name: vidya_trackit
description: "Vidya TrackIt - live bus tracking (Supabase Realtime + driver GPS + FCM alarm)"
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend: Postgres + Auth + Realtime + Edge Functions.
  # Pass credentials at build time:
  #   --dart-define=SUPABASE_URL=... --dart-define=SUPABASE_ANON_KEY=...
  supabase_flutter: ^2.6.0
  http: ^1.2.2

  # Firebase is kept ONLY for Cloud Messaging (Supabase has no push service).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Driver GPS + background foreground-service
  geolocator: ^13.0.1
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7
  permission_handler: ^11.3.1

  # Live map (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_animations: ^0.7.0

  # Alarm notifications + local storage
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Optional custom alarm sound: android/app/src/main/res/raw/alarm.mp3
  # (falls back to the default alarm sound if absent). See SETUP.md.
