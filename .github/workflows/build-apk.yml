name: Build APK

on:
  push:
    branches: [ main, master, supabase-migration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # The repo ships only lib/, pubspec.yaml, native_config/, etc. Scaffold
      # the platform folders, then drop our sources + manifest on top.
      - name: Scaffold platform folders
        run: |
          flutter create --org com.vidya --project-name vidya_trackit --platforms=android .

      # flutter_local_notifications requires Java 8+ core-library desugaring.
      # A fresh `flutter create` does not enable it, so patch the generated app
      # Gradle file (works for both the Groovy build.gradle and the Kotlin DSL
      # build.gradle.kts that newer Flutter versions generate).
      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          import os, re

          app = "android/app"
          kts = os.path.join(app, "build.gradle.kts")
          groovy = os.path.join(app, "build.gradle")
          if os.path.exists(kts):
              path, is_kts = kts, True
          elif os.path.exists(groovy):
              path, is_kts = groovy, False
          else:
              raise SystemExit("No app Gradle file found under android/app")

          with open(path) as f:
              src = f.read()

          flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
          dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                 if is_kts else
                 "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")

          # 1) Turn on the desugaring flag inside compileOptions { }.
          if "CoreLibraryDesugaringEnabled" not in src:
              if "compileOptions {" in src:
                  src = src.replace("compileOptions {",
                                    "compileOptions {\n        " + flag, 1)
              else:
                  block = "\n    compileOptions {\n        %s\n    }\n" % flag
                  src = re.sub(r"android\s*\{",
                               lambda m: m.group(0) + block, src, count=1)

          # 2) Add the desugar_jdk_libs dependency (a second dependencies {}
          #    block is legal - Gradle merges them).
          if "desugar_jdk_libs" not in src:
              src = src.rstrip() + "\n\ndependencies {\n    %s\n}\n" % dep

          with open(path, "w") as f:
              f.write(src)

          print("Patched", path, "(kts)" if is_kts else "(groovy)")
          print("----- tail -----")
          print(src[-500:])
          PY

      # google-services.json is gitignored - it is per-Firebase-project and
      # forks must not inherit ours - so it is never present on CI. The Google
      # Services Gradle plugin hard-fails when it cannot find that file, which
      # kills the build at :app:processDebugGoogleServices.
      #
      # android/app/build.gradle.kts already applies the plugin conditionally,
      # but `flutter create` above can regenerate that file, so strip the
      # plugin here as well. Only runs when the JSON really is missing; a
      # Firebase-configured build keeps the plugin and push notifications.
      - name: Strip Firebase Gradle plugin when unconfigured
        run: |
          python3 - <<'PY'
          import os, re

          candidates = [
              "android/app/google-services.json",
              "android/app/src/google-services.json",
              "android/app/src/debug/google-services.json",
              "android/app/src/release/google-services.json",
          ]
          if any(os.path.exists(p) for p in candidates):
              print("google-services.json present - keeping the plugin, FCM enabled")
              raise SystemExit(0)

          print("google-services.json absent - building without FCM")

          for path in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  src = f.read()
              before = src

              # plugins { id("com.google.gms.google-services") }  /  Groovy form
              src = re.sub(
                  r'^[ \t]*(id[ \t]*[\("\x27].*google-services.*|'
                  r'apply[ \t]+plugin[ \t]*:.*google-services.*|'
                  r'apply\(plugin[ \t]*=.*google-services.*\))[ \t]*\)?[ \t]*$\n?',
                  "",
                  src,
                  flags=re.MULTILINE,
              )

              if src != before:
                  with open(path, "w") as f:
                      f.write(src)
                  print("Removed google-services plugin from", path)
              else:
                  print("No google-services plugin line in", path)
          PY

      - name: Apply Android manifest
        run: |
          cp native_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      # Supabase config comes from repository secrets, never from the repo.
      # Settings > Secrets and variables > Actions:
      #   SUPABASE_URL       https://<ref>.supabase.co
      #   SUPABASE_ANON_KEY  the anon (public) key - NOT the service-role key
      # If the secrets are absent the APK still builds and opens in demo mode.
      - name: Write env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {
              "SUPABASE_URL": os.environ.get("SUPABASE_URL", ""),
              "SUPABASE_ANON_KEY": os.environ.get("SUPABASE_ANON_KEY", ""),
          }
          with open("env.json", "w") as f:
              json.dump(cfg, f)
          print("env.json written; url set:", bool(cfg["SUPABASE_URL"]),
                "key set:", bool(cfg["SUPABASE_ANON_KEY"]))
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=env.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vidya-trackit-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
